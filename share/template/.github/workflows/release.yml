name: Release

# Quality gate first, then the shared release from cicd: tag check, double build on two runners, hash compare, GitHub Release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  release:
    name: Release
    needs: quality-gate
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: RomanHorshkov/cicd/.github/workflows/c-release.yml@v2
    with:
      kind: app
      title: kyr_word
    secrets:
      SIBLING_REPOS_PAT: ${{ secrets.SIBLING_REPOS_PAT }}
